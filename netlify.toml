[build]
  publish = "."
  # Pulls the latest daily nuggets from YouTube into index.html and writes sitemap.xml (never fails the build).
  command = "node build/latest.mjs"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/podcast.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=900"

# Same feed at .rss (some directories expect that extension).
[[redirects]]
  from = "/podcast.rss"
  to = "/podcast.xml"
  status = 200

[[headers]]
  for = "/podcast.rss"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
