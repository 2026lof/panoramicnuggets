<!DOCTYPE html>
<html lang="en">
<head>

      display:grid;
      place-items:center;
      text-align:center;
      padding:24px;
    }
    .card{

      background:rgba(255,255,255,.08);

    h1{font-size:42px;line-height:1;margin:0 0 16px}

    a{
      display:inline-block;
      background:linear-gradient(135deg,#ffc857,#ffe08a);
      color:#071421;
      padding:14px 24px;
      border-radius:999px;
      text-decoration:none;
      font-weight:900;

  <div class="card">
